name: iOS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Kotlin Multiplatform iOS framework
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Build iOS App for Simulator
        run: |
          ln -s ../shared/build/XCFrameworks/debug/shared.xcframework iosApp/shared.xcframework

          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=Any iOS Simulator Device,OS=latest' \
                     build CODE_SIGNING_ALLOWED=NO
